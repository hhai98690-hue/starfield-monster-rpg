<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#173c38">
<title>星野馴獸師｜像素冒險</title>
<style>
:root{--ink:#193a35;--cream:#fff4cc;--gold:#f4cc67;--panel:#183b38;--mint:#bde8b4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#122e30;color:var(--cream);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);display:flex;justify-content:center}
.app{width:min(100%,520px);padding:10px 0 18px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
h1{font-size:clamp(17px,5vw,24px);margin:0;color:#ffe39a;text-shadow:2px 2px #704a35}
.sub{font-size:10px;color:#c4e6c6;margin-top:4px}
.pill{background:#234b43;border:2px solid #7cae7b;border-radius:8px;padding:7px 9px;font-size:12px;white-space:nowrap}
.frame{border:4px solid #f3d88d;border-radius:10px;background:#244d40;padding:5px;box-shadow:0 5px 0 #091c20}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:2px solid #122e30;background:#8acb7a;touch-action:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0}
.stat{background:#193b37;border:2px solid #668f69;padding:8px;border-radius:7px;font-size:11px;line-height:1.6}
.stat b{color:#ffdf84}
.message{min-height:57px;background:#183b38;border:2px solid #d5c27c;border-radius:8px;padding:10px;font-size:12px;line-height:1.5;margin:8px 0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pad,.actions{background:#193b37;border:2px solid #557e62;border-radius:8px;padding:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;align-content:center}
button{font:inherit;color:#fff4cc;background:#315d4c;border:2px solid #8eb782;border-radius:7px;min-height:43px;padding:8px 5px;box-shadow:0 3px 0 #102923;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #102923;background:#46785a}
.pad button{font-size:19px;min-height:44px}
.pad .blank{visibility:hidden}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.actions button{font-size:11px}
.actions button.primary{background:#93613c;border-color:#f4ce78}
.footer{font-size:10px;color:#9fc5ad;text-align:center;margin-top:10px;line-height:1.6}
.modal{position:fixed;inset:0;background:#071a1acc;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}
.modal.show{display:flex}.card{width:min(100%,440px);background:#183b38;border:3px solid #f3d88d;border-radius:10px;padding:16px;box-shadow:0 7px #071a1a}
.card h2{font-size:18px;color:#ffe39a;margin:0 0 12px}.card p{font-size:12px;line-height:1.7}
.monsterRow{display:flex;justify-content:space-between;gap:8px;border:1px solid #6c9d70;padding:9px;margin:6px 0;border-radius:6px;font-size:12px}
.card button{width:100%;margin-top:8px}
@media(min-width:440px){.controls{grid-template-columns:1fr 1fr}.app{padding-top:18px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>✦ 星野馴獸師</h1><div class="sub">PIXEL MONSTER ADVENTURE · 原創遊戲原型</div></div><div class="pill">★ <span id="coins">20</span></div></header>
<div class="frame"><canvas id="scene" width="320" height="360" aria-label="像素草原遊戲畫面"></canvas></div>
<div class="stats">
 <div class="stat"><b id="heroName">焰尾狐 Lv.1</b><br>HP <span id="heroHp">24/24</span><br><span id="partyCount">隊伍：1 隻</span></div>
 <div class="stat"><b id="areaName">星野草原</b><br>藥水 <span id="potions">2</span><br>收服 <span id="caught">0</span> 隻</div>
</div>
<div class="message" id="message" role="status">歡迎來到星野草原！使用方向鍵移動，探索草叢尋找新夥伴。</div>
<div class="controls">
 <div class="pad">
  <button class="blank">　</button><button data-move="up" aria-label="向上">▲</button><button class="blank">　</button>
  <button data-move="left" aria-label="向左">◀</button><button data-move="down" aria-label="向下">▼</button><button data-move="right" aria-label="向右">▶</button>
 </div>
 <div class="actions">
  <button class="primary" id="interact">探索／互動</button>
  <button id="attack">攻擊</button>
  <button id="catch">嘗試收服</button>
  <button id="potion">使用藥水</button>
  <button id="team">怪獸隊伍</button>
  <button id="bag">背包</button>
  <button id="save">保存進度</button>
  <button id="reset">重新開始</button>
 </div>
</div>
<div class="footer">原創像素冒險原型 v0.1 · 進度保存在此瀏覽器<br>正式上架前仍需完成測試、隱私政策與 iOS 打包。</div>
</div>
<div class="modal" id="modal"><div class="card"><h2 id="modalTitle">隊伍</h2><div id="modalBody"></div><button id="closeModal">返回遊戲</button></div></div>
<script>
(() => {
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const initial=()=>({x:8,y:8,steps:0,coins:20,potions:2,caught:0,mode:'world',enemy:null,team:[{name:'焰尾狐',hp:24,max:24,power:7,level:1,color:'#ed8854',accent:'#ffd16c'}]});
let s=initial(), lastMove=0;
const wild=[
 {name:'草芽獸',hp:17,power:4,color:'#72bd70',accent:'#d5f18b'},
 {name:'泡泡團',hp:15,power:3,color:'#68bce0',accent:'#d4f4ff'},
 {name:'石甲仔',hp:21,power:5,color:'#a4a9a6',accent:'#e4d5a0'},
 {name:'星耳兔',hp:14,power:4,color:'#d6a0d9',accent:'#ffe2f4'}
];
function message(t){$('message').textContent=t}
function save(){try{localStorage.setItem('starfield_save_v1',JSON.stringify(s));message('進度已保存！下次在同一個瀏覽器開啟還能繼續冒險。')}catch(e){message('目前瀏覽器未允許保存資料，請確認 Safari 的網站資料設定。')}update()}
function load(){try{const d=localStorage.getItem('starfield_save_v1');if(d){const obj=JSON.parse(d);if(obj&&obj.team&&obj.team.length)s={...initial(),...obj};}}catch(e){}}
function update(){
 $('coins').textContent=s.coins;$('heroName').textContent=`${s.team[0].name} Lv.${s.team[0].level}`;
 $('heroHp').textContent=`${s.team[0].hp}/${s.team[0].max}`;$('partyCount').textContent=`隊伍：${s.team.length} 隻`;
 $('potions').textContent=s.potions;$('caught').textContent=s.caught;
 $('areaName').textContent=s.mode==='battle'?'遭遇戰':'星野草原';
 draw();
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function creature(x,y,color,accent,scale=1){
 const p=scale;rect(x-8*p,y-3*p,16*p,13*p,color);rect(x-7*p,y-9*p,5*p,8*p,accent);rect(x+2*p,y-10*p,5*p,9*p,accent);
 rect(x-5*p,y+8*p,4*p,4*p,color);rect(x+3*p,y+8*p,4*p,4*p,color);
 rect(x-5*p,y+1*p,2*p,2*p,'#202936');rect(x+3*p,y+1*p,2*p,2*p,'#202936');rect(x-2*p,y+6*p,5*p,2*p,'#a94b4a');
}
function draw(){
 // pixel meadow
 rect(0,0,320,360,'#8fd1e7');rect(0,65,320,295,'#8acb78');
 for(let i=0;i<6;i++){rect(i*62-18,63,40,22,'#71b96f');rect(i*62-8,48,24,30,'#71b96f');rect(i*62+2,39,14,25,'#78c477')}
 // tiled grass patches
 for(let i=0;i<45;i++){let x=(i*53+11)%315,y=(i*37+95)%250+80;rect(x,y,3,3,i%3===0?'#d7e89a':i%3===1?'#4e9c5a':'#f7e7a0')}
 // winding path
 ctx.fillStyle='#d9bd82';ctx.beginPath();ctx.moveTo(105,360);ctx.lineTo(138,220);ctx.lineTo(185,170);ctx.lineTo(205,170);ctx.lineTo(166,240);ctx.lineTo(153,360);ctx.closePath();ctx.fill();
 // trees
 [[35,115],[278,128],[45,255],[272,270],[86,178],[238,325]].forEach(([x,y])=>{rect(x-4,y+12,8,18,'#795638');rect(x-14,y-4,28,23,'#2d7849');rect(x-10,y-14,20,18,'#3c9952');rect(x-5,y-20,10,12,'#57b85f')});
 // chest
 rect(208,92,25,19,'#8b4b2b');rect(208,92,25,6,'#d88a3d');rect(218,98,4,8,'#f8df79');
 // player
 const px= Math.max(15,Math.min(305,s.x*18+7)),py=Math.max(90,Math.min(342,s.y*17+92));
 rect(px-6,py-9,12,12,'#f1c59a');rect(px-7,py-13,14,6,'#714b37');rect(px-8,py+2,16,12,'#356cbd');rect(px-6,py+14,5,6,'#3b354d');rect(px+2,py+14,5,6,'#3b354d');rect(px-3,py-5,2,2,'#202936');rect(px+2,py-5,2,2,'#202936');
 creature(px+17,py+9,'#ed8854','#ffd16c',.7);
 rect(8,8,160,22,'#183b38');ctx.strokeStyle='#f3d88d';ctx.lineWidth=2;ctx.strokeRect(8,8,160,22);
 ctx.fillStyle='#ffe39a';ctx.font='10px monospace';ctx.fillText(s.mode==='battle'?'遭遇戰！':'星野草原',15,22);
 if(s.mode==='battle'&&s.enemy){
  rect(16,42,288,110,'#183b38');ctx.strokeStyle='#f3d88d';ctx.strokeRect(16,42,288,110);
  ctx.fillStyle='#fff4cc';ctx.font='12px monospace';ctx.fillText(s.enemy.name,27,61);
  ctx.fillStyle='#bde8b4';ctx.font='10px monospace';ctx.fillText(`HP ${s.enemy.hp}/${s.enemy.max}`,27,78);
  rect(27,85,120,7,'#40534a');rect(27,85,120*s.enemy.hp/s.enemy.max,7,'#75d46f');
  creature(245,104,s.enemy.color,s.enemy.accent,1.6);
  ctx.fillStyle='#ffe39a';ctx.fillText('下方按鈕選擇行動',27,132);
 }
}
function move(dir){
 if(s.mode!=='world')return;
 const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];s.x=Math.max(0,Math.min(15,s.x+d[0]));s.y=Math.max(0,Math.min(14,s.y+d[1]));s.steps++;
 if(s.steps%5===0){const w=wild[Math.floor(Math.random()*wild.length)];s.enemy={...w,max:w.hp};s.mode='battle';message(`野生的${w.name}出現了！先削弱牠，再嘗試收服。`)}
 else message(['草葉隨風搖動……','遠處傳來奇怪的叫聲。','你看見草叢輕輕晃動。','繼續探索，也許會遇到新夥伴！'][Math.floor(Math.random()*4)]);
 update();
}
function attack(){
 if(s.mode!=='battle')return message('先在草原探索，遇到野生怪獸後才能攻擊。');
 const dmg= Math.max(3,Math.floor(Math.random()*5)+s.team[0].power-3);s.enemy.hp=Math.max(0,s.enemy.hp-dmg);
 if(s.enemy.hp===0){s.coins+=8;s.team[0].level++;s.team[0].power++;s.mode='world';s.enemy=null;message(`勝利！焰尾狐升級了，獲得 8 枚星幣！`)}
 else {const hit=s.enemy.power;s.team[0].hp=Math.max(0,s.team[0].hp-hit);if(!s.team[0].hp){s.team[0].hp=s.team[0].max;s.mode='world';s.enemy=null;message('焰尾狐需要休息，已恢復體力。')}else message(`造成 ${dmg} 點傷害！對方反擊，你受到 ${hit} 點傷害。`)}
 update();
}
function catchMonster(){
 if(s.mode!=='battle')return message('遇到野生怪獸後，才能嘗試收服。');
 if(s.enemy.hp>s.enemy.max*.55){s.team[0].hp=Math.max(1,s.team[0].hp-s.enemy.power);message('怪獸還很有精神！先攻擊幾次，再試著收服。')}
 else if(Math.random()<.68){const e=s.enemy;s.team.push({name:e.name,hp:18,max:18,power:5,level:1,color:e.color,accent:e.accent});s.caught++;s.mode='world';s.enemy=null;message(`收服成功！${e.name}加入你的隊伍！`)}
 else {s.team[0].hp=Math.max(1,s.team[0].hp-s.enemy.power);message('差一點就成功了！怪獸趁機反擊，再試一次。')}
 update();
}
function potion(){if(s.potions<=0)return message('沒有藥水了！');s.potions--;s.team[0].hp=Math.min(s.team[0].max,s.team[0].hp+10);message('使用藥水，第一隻隊伍怪獸恢復 10 點 HP。');if(s.mode==='battle')s.team[0].hp=Math.max(1,s.team[0].hp-s.enemy.power);update()}
function modal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('show')}
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.move)));
$('interact').onclick=()=>{if(s.mode==='battle'){s.mode='world';s.enemy=null;message('你安全地離開戰鬥。')}else if(Math.abs(s.x-11)+Math.abs(s.y-2)<5){s.coins+=5;message('你打開一個小寶箱，獲得 5 枚星幣！')}else {const w=wild[Math.floor(Math.random()*wild.length)];s.enemy={...w,max:w.hp};s.mode='battle';message(`野生的${w.name}出現了！`)}update()};
$('attack').onclick=attack;$('catch').onclick=catchMonster;$('potion').onclick=potion;
$('team').onclick=()=>modal('怪獸隊伍',s.team.map((m,i)=>`<div class="monsterRow"><span>${i===0?'★ ':''}${m.name} Lv.${m.level}<br>HP ${m.hp}/${m.max}</span><span>攻擊力 ${m.power}</span></div>`).join(''));
$('bag').onclick=()=>modal('冒險者背包',`<p>★ 星幣：${s.coins}</p><p>藥水：${s.potions}</p><p>已收服怪獸：${s.caught} 隻</p><p>探索步數：${s.steps}</p>`);
$('save').onclick=save;$('reset').onclick=()=>{if(confirm('確定重新開始？目前進度會被清除。')){s=initial();save();message('新冒險開始！走進草叢尋找夥伴吧。');update()}};
$('closeModal').onclick=()=>$('modal').classList.remove('show');
load();update();
})();
</script>
</body>
</html>
