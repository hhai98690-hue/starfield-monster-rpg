function makeCritter(color,accent=0xffdf73,scale=1){const g=new THREE.Group();blob(g,0,.6,0,.56*scale,.47*scale,.55*scale,color);blob(g,0,1.02,.12,.36*scale,.34*scale,.34*scale,color);blob(g,-.25*scale,1.33,0,.13*scale,.31*scale,.14*scale,accent,true).rotation.z=-.2;blob(g,.25*scale,1.33,0,.13*scale,.31*scale,.14*scale,accent,true).rotation.z=.2;blob(g,-.13*scale,1.08,.4,.055*scale,.08*scale,.035*scale,0x172c36);blob(g,.13*scale,1.08,.4,.055*scale,.08*scale,.035*scale,0x172c36);blob(g,0,.88,.48,.11*scale,.05*scale,.035*scale,0xff9b91);return g}
const player=new THREE.Group();scene.add(player);blob(player,0,1.05,0,.42,.62,.32,0x3f83e8);blob(player,0,1.85,0,.43,.43,.4,0xffd3a3);blob(player,-.16,1.9,.34,.06,.09,.035,0x273b54);blob(player,.16,1.9,.34,.06,.09,.035,0x273b54);blob(player,0,2.33,-.02,.48,.16,.42,0x294c8e);blob(player,-.2,2.35,0,.19,.13,.2,0xffdb69);blob(player,.2,2.35,0,.19,.13,.2,0xffdb69);const body=player.children[0];

const enemies=[];const catalog={};
function spawnEnemy(x,z,color,name,type){const g=makeCritter(color,0xffdf73,.85);g.position.set(x,0,z);scene.add(g);enemies.push({g,hp:60,max:60,name,type,color,alive:true,hit:0})}
spawnEnemy(3,-7,0xf08b70,'火尾球','火');spawnEnemy(-7,-13,0x9e9af5,'月耳兔','月');spawnEnemy(8,-24,0x72c77d,'苔角獸','草');spawnEnemy(-10,-31,0xf4a5c6,'粉棉狐','風');spawnEnemy(14,-7,0xf1c86a,'金斑獸','光');spawnEnemy(-15,3,0x72c77d,'苔角獸','草');
function makeNPC(){const g=new THREE.Group();g.position.set(0,0,-4);scene.add(g);blob(g,0,1,0,.38,.58,.3,0xf1a14e);blob(g,0,1.78,0,.38,.38,.36,0xffd3a3);blob(g,0,2.2,-.02,.44,.13,.4,0x4b77a5);blob(g,-.15,1.83,.31,.045,.07,.03,0x233746);blob(g,.15,1.83,.31,.045,.07,.03,0x233746);const flag=new THREE.Group();flag.position.set(1.1,0,0);g.add(flag);const pole=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,2.5,6),mat(0xf7e9bf));pole.position.y=1.25;flag.add(pole);blob(flag,.35,2.1,0,.42,.22,.06,0x3c83ff);return g}

let hp=100,level=1,xp=0,coins=0,started=false,joy={x:0,y:0},keys={},last=performance.now(),toastTimer,quest=0,defeated=0,captured=0;
let discovered={};try{const d=JSON.parse(localStorage.getItem('starfield3d_v02')||'{}');level=d.level||1;xp=d.xp||0;coins=d.coins||0;quest=d.quest||0;defeated=d.defeated||0;captured=d.captured||0;discovered=d.discovered||{}}catch(e){}

function toast(t){$('toast').textContent=t;$('toast').classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('on'),1700)}
function msg(t){$('message').textContent=t;$('message').classList.add('show');setTimeout(()=>$('message').classList.remove('show'),2300)}
function nearEnemy(){let best=null,d=999;for(const e of enemies)if(e.alive){let q=e.g.position.distanceTo(player.position);if(q<d){d=q;best=e}}return d<5?best:null}
function updateQuest(){let text=quest===0?'和草原嚮導對話（走近藍色旗幟）':quest===1?'擊退 2 隻野生怪獸':quest===2?'馴服 1 隻體力較低的怪獸':'第一章完成！繼續探索並收集怪獸';$('questText').textContent=text;$('questProgress').textContent=quest===0?'進度：0 / 1':quest===1?'進度：'+Math.min(defeated,2)+' / 2':quest===2?'進度：'+Math.min(captured,1)+' / 1':'獎勵：星塵 × 30';}
function updateHUD(){$('hptext').textContent=Math.round(hp)+'/100';$('hpFill').style.width=hp+'%';$('levelText').textContent='Lv.'+level+' · 星塵 '+coins;$('monsterFill').style.width=Math.max(30,100-captured*12)+'%';updateQuest()}
function attack(power=24){const e=nearEnemy();if(!e){toast('靠近野生怪獸再攻擊！');return}e.hp-=power;e.hit=.25;player.rotation.y=Math.atan2(e.g.position.x-player.position.x,e.g.position.z-player.position.z);if(e.hp<=0){e.alive=false;scene.remove(e.g);defeated++;coins+=5;xp+=25;toast(e.name+' 被擊退！星塵 +5');if(quest===1&&defeated>=2)quest=2;if(xp>=50){xp-=50;level++;toast('升級！現在 Lv.'+level)}save()}else toast('命中！ -'+power);updateHUD()}

function capture(){const e=nearEnemy();if(!e){toast('靠近怪獸再嘗試馴服');return}if(e.hp>e.max*.45){toast('先削弱牠！體力低於 45% 才能馴服');return}if(Math.random()<.75){e.alive=false;scene.remove(e.g);captured++;coins+=3;discovered[e.name]=(discovered[e.name]||0)+1;xp+=20;toast('馴服成功！'+e.name+' 加入圖鑑');if(quest===2&&captured>=1)quest=3;save()}else toast('馴服失敗，再試一次！');updateHUD()}

$('bookBtn').onclick=openBook;$('closeBook').onclick=()=>$('book').style.display='none';$('interactBtn').onclick=interact;$('attackBtn').onpointerdown=e=>{e.preventDefault();attack(24+level*3)};$('skillBtn').onpointerdown=e=>{e.preventDefault();skill()};$('captureBtn').onpointerdown=e=>{e.preventDefault();capture()};

const zone=$('stickZone'),stick=$('stick');let pointer=null,center={x:0,y:0};zone.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;zone.setPointerCapture(pointer);const r=zone.getBoundingClientRect();center={x:r.left+r.width/2,y:r.top+r.height/2};moveJoy(e)});zone.addEventListener('pointermove',e=>{if(pointer===e.pointerId)moveJoy(e)});function moveJoy(e){let dx=e.clientX-center.x,dy=e.clientY-center.y,l=Math.hypot(dx,dy),max=42;if(l>max){dx=dx/l*max;dy=dy/l*max}joy.x=dx/max;joy.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}function resetJoy(){pointer=null;joy={x:0,y:0};stick.style.transform='translate(0,0)'}zone.addEventListener('pointerup',resetJoy);zone.addEventListener('pointercancel',resetJoy);
